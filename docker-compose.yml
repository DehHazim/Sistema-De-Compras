services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sic
      POSTGRES_PASSWORD: sic
      POSTGRES_DB: sic
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sic"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgres://sic:sic@db:5432/sic
      JWT_SECRET: docker-dev-secret-change-me
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3333:3333"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  dbdata:
